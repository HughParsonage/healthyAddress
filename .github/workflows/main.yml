name: Check
'on': push

jobs:
  build:
    name: covr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@master
      - name: Install Package Dependencies
        run: |-
          Rscript setup.R
          Rscript -e "install.packages(c('rcmdcheck', 'covr', 'remotes'), repos = 'https://cloud.r-project.org')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cloud.r-project.org')"
      - name: codecov
        run: Rscript -e "covr::codecov(quiet = FALSE)"
    container: rocker/verse:latest
  rcmdchecker:
    name: Rcmdcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@master
      - name: Install Package Dependencies
        run: |-
            Rscript setup.R
            Rscript -e "install.packages(c('rcmdcheck', 'remotes'), repos = 'https://cloud.r-project.org')"
            Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cloud.r-project.org')"
      - name: Run Check
        run: Rscript -e "rcmdcheck::rcmdcheck(args = '--no-manual', error_on = 'note')"
    container: rocker/verse:latest
  test-r-sanitizers:
    name: ASAN-UBSAN
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-hub/containers/gcc-asan:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          R -q -e 'pak::pkg_install(c("deps::.", "any::rcmdcheck"), dependencies = TRUE)'
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
